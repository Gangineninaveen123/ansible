- name: Install nginx
  hosts: dynamic_frontend  # here i am getting the frontend ec2 instances , which are running, will come from[dynamic_inventory.aws_ec2]
  become: yes
  serial: 3  
  tasks:
  - name: Install nginx
    ansible.builtin.package:
      name: nginx
      state: installed
  - name: Run nginx
    ansible.builtin.service:
      name: nginx
      state: restarted
      enabled: yes
      